<header class="app-header">
  <nav>
    <h1>Brain2 API Demo App</h1>
    <div class="nav-actions">
      <div class="system-status-header" 
           [style.background-color]="darkMode() ? '#2a2a2a' : '#f8f9fa'" 
           [style.border]="darkMode() ? '1px solid #404040' : '1px solid #e9ecef'"
           [attr.data-dark-mode]="darkMode()">
        <span class="status-item">
          <span class="status-label" [style.color]="darkMode() ? '#ffffff' : '#6c757d'">BRAIN2 API:</span>
          <ng-container [ngSwitch]="apiConnected()">
            <span *ngSwitchCase="true" class="status-value connected" [style.color]="darkMode() ? '#4ade80' : '#28a745'">Connected</span>
            <span *ngSwitchCase="false" class="status-value disconnected" [style.color]="darkMode() ? '#f87171' : '#dc3545'">Offline</span>
            <span *ngSwitchDefault class="status-value" [style.color]="darkMode() ? '#eab308' : '#ffc107'">Checking…</span>
          </ng-container>
        </span>
        <span class="status-item">
          <span class="status-label" [style.color]="darkMode() ? '#ffffff' : '#6c757d'">Auth:</span>
          <ng-container *ngIf="(isAuthenticated$ | async); else notAuth">
            <span class="status-value" [style.color]="darkMode() ? '#38bdf8' : '#17a2b8'">Active</span>
          </ng-container>
          <ng-template #notAuth>
            <span class="status-value" [style.color]="darkMode() ? '#f87171' : '#dc3545'">Not authenticated</span>
          </ng-template>
        </span>
        <span class="status-item" *ngIf="(isAuthenticated$ | async)">
          <span class="status-label" [style.color]="darkMode() ? '#ffffff' : '#6c757d'">Token expires in:</span>
          <span class="status-value" [style.color]="darkMode() ? '#ffffff' : '#212529'">
            {{ tokenSecondsLeft() === null ? '—' : formatSeconds(tokenSecondsLeft()!) }}
          </span>
        </span>
      </div>
      <button mat-button type="button" (click)="toggleDarkMode()" class="mode-toggle-btn">
        {{ darkMode() ? 'Light Mode' : 'Dark Mode' }}
      </button>
      <span *ngIf="(isAuthenticated$ | async); else pleaseLogin">Welcome, {{ (currentUser$ | async)?.name }}</span>
      <ng-template #pleaseLogin>
        <span>Please log in</span>
      </ng-template>
      <button *ngIf="(isAuthenticated$ | async)" (click)="logout()" class="logout-btn">Logout</button>
    </div>
  </nav>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
