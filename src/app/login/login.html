<div class="login-container mat-typography">
  <mat-card appearance="outlined" class="login-form-card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form-fields">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Enter your username" autocomplete="username" />
          <mat-error *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">Username is required</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Enter your password" autocomplete="current-password" />
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">Password is required</mat-error>
        </mat-form-field>
          <fieldset class="server-settings">
            <legend>Server settings</legend>
            <div class="form-row">
              <label for="host">Server Host/IP</label>
              <input id="host" type="text" formControlName="host" placeholder="localhost" />
            </div>
            <div class="form-row">
              <label for="port">Port</label>
              <input id="port" type="number" formControlName="port" placeholder="9997 or 9998" />
            </div>
            <div class="form-row checkbox-row">
              <input id="https" type="checkbox" formControlName="useHttps" />
              <label for="https">Use HTTPS</label>
            </div>
            <div class="hint">Tip: Port 9997 defaults to HTTP, 9998 defaults to HTTPS. You can override using the checkbox.</div>
            <div class="test-connection">
              <button type="button" mat-stroked-button color="primary" (click)="testConnection()" [disabled]="isTestingConnection">
                <span *ngIf="!isTestingConnection">Test Connection</span>
                <span *ngIf="isTestingConnection">Testing...</span>
              </button>
            </div>
             </fieldset>
        <div class="actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading">
            <span *ngIf="!isLoading">Login</span>
            <span *ngIf="isLoading">Logging in...</span>
          </button>
        </div>
        <mat-hint *ngIf="errorMessage" class="error-hint">{{ errorMessage }}</mat-hint>
      </form>
    </mat-card-content>
  </mat-card>
  <!-- Global full-width status banner for Test Connection -->
  <div class="global-status"
    *ngIf="testStatus"
    [ngClass]="{ 'success': testStatus.startsWith('✅'), 'error': !testStatus.startsWith('✅') }">
    {{ testStatus }}
  </div>
</div>
