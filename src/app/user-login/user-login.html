<div class="user-login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>🔐 Login</h1>
      <p class="subtitle">Login with your Brain2 credentials</p>
    </div>

    <form class="login-form" (submit)="onSubmit(); $event.preventDefault()">
      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="error-banner">
          <i class="icon-alert"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Username Field -->
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          [value]="username()"
          (input)="onUsernameInput($event)"
          (keypress)="onKeyPress($event)"
          placeholder="Enter your username"
          autocomplete="username"
          [disabled]="isLoading()"
          required
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          [value]="password()"
          (input)="onPasswordInput($event)"
          (keypress)="onKeyPress($event)"
          placeholder="Enter your password"
          autocomplete="current-password"
          [disabled]="isLoading()"
          required
        />
      </div>

      <!-- Server Configuration Section -->
      <div class="server-config-section">
        <div class="section-header-with-toggle">
          <h3 class="section-title">🌐 Brain2 Server Configuration</h3>
          <div class="version-toggle">
            <label class="toggle-label">Version:</label>
            <button
              type="button"
              class="btn-toggle"
              [class.v2]="brain2Version() === 'v2'"
              [class.v3]="brain2Version() === 'v3'"
              (click)="toggleBrain2Version()"
              [disabled]="isLoading()"
              title="Toggle between Brain2 v2.xx and v3.xx"
            >
              {{ brain2Version() === 'v2' ? 'v2.xx' : 'v3.xx' }}
            </button>
          </div>
        </div>
        
        <div class="form-group">
          <label for="host">Server Host/IP</label>
          <input
            type="text"
            id="host"
            [value]="host()"
            (input)="onHostInput($event)"
            placeholder="localhost"
            [disabled]="isLoading()"
          />
        </div>

        <div class="form-group">
          <label for="port">Port</label>
          <input
            type="number"
            id="port"
            [value]="port()"
            (input)="onPortInput($event)"
            placeholder="9997 or 9998"
            [disabled]="isLoading()"
          />
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input
              type="checkbox"
              [checked]="useHttps()"
              (change)="onHttpsChange($event)"
              [disabled]="isLoading()"
            />
            <span>Use HTTPS</span>
          </label>
        </div>

        <p class="hint-text">💡 Port 9997 defaults to HTTP, 9998 defaults to HTTPS</p>

        <!-- Test Connection Button -->
        <button
          type="button"
          class="btn btn-secondary btn-test"
          (click)="testConnection()"
          [disabled]="isTestingConnection() || isLoading()"
        >
          @if (isTestingConnection()) {
            <span class="spinner"></span>
            <span>Testing...</span>
          } @else {
            <span>🔌 Test Connection</span>
          }
        </button>

        @if (testStatus()) {
          <div class="test-status" [class.success]="testStatus().startsWith('✅')" [class.error]="testStatus().startsWith('❌')">
            {{ testStatus() }}
          </div>
        }
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="btn btn-primary btn-login"
        [disabled]="isLoading() || !username() || !password()"
      >
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Logging in...</span>
        } @else {
          <span>Login</span>
        }
      </button>
    </form>
  </div>
</div>
